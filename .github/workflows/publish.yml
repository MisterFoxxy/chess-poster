name: Publish posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install requests pillow tzdata

      - name: Публикация одобренных постов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          POST_TZ: Europe/Moscow
        run: python publisher.py

      - name: Сохранить статусы постов
        if: always()
        run: |
          git config user.name "chess-poster-bot"
          git config user.email "chess-poster-bot@users.noreply.github.com"
          git add -A posts
          if ! git diff --cached --quiet; then
            git commit -m "Обновлены статусы постов"
            git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)
          fi
